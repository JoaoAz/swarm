<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swarm</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #ffd6dc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    canvas { display: block; cursor: none; } /* o cursor do sistema não compete com o swarm */
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; background: rgba(0,0,0,0.55); z-index: 10; transition: opacity .6s; }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay h1 { font-weight: 400; letter-spacing: .5em; font-size: 14px; margin: 0; color: #ff1a2a;
      text-shadow: 0 0 12px #ff1a2a; }
    #overlay p { margin: 0; font-size: 12px; opacity: .6; max-width: 34em; text-align: center; line-height: 1.6; padding: 0 16px; }
    #start { background: transparent; color: #ffd6dc; border: 1px solid #ff1a2a; padding: 12px 34px;
      font: inherit; letter-spacing: .3em; cursor: pointer; box-shadow: 0 0 18px rgba(255,26,42,.45), inset 0 0 12px rgba(255,26,42,.25); }
    #start:hover { background: rgba(255,26,42,.15); }
    #vr-button { z-index: 20; }
    .lil-gui { cursor: default; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.js"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <h1>S W A R M</h1>
    <p>Arrastar para olhar à volta · duplo clique para pointer lock · espaço: play/pausa · C: câmara cinemática · H: esconder painel</p>
    <button id="start">START</button>
    <p>Em VR, usa o botão ENTER VR: a sequência começa ao entrar.</p>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
